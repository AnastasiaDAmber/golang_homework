apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "calendar-chart.fullname" . }}-sender
  labels:
    {{- include "calendar-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: sender
spec:
  replicas: {{ .Values.sender.replicaCount }}
  selector:
    matchLabels:
      {{- include "calendar-chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sender
  template:
    metadata:
      labels:
        {{- include "calendar-chart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sender
    spec:
      containers:
      - name: sender
        image: "{{ .Values.sender.image.repository }}:{{ .Values.sender.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.sender.image.pullPolicy }}
        env:
        - name: LOG_LEVEL
          value: {{ .Values.sender.logLevel | quote }}
        - name: RABBITMQ_URL
          value: "amqp://{{ .Values.rabbitmq.auth.username }}:{{ .Values.rabbitmq.auth.password }}@{{ .Values.rabbitmq.service.name }}:{{ .Values.rabbitmq.service.port }}/"
        - name: RABBITMQ_QUEUE_NAME
          value: {{ .Values.rabbitmq.queueName | quote }}
        - name: DB_DSN
          value: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ .Values.postgresql.service.name }}:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.auth.database }}?sslmode=disable"
        resources:
          {{- toYaml .Values.sender.resources | nindent 10 }}
      {{- with .Values.sender.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sender.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

